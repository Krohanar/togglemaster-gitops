apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-datasource
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Krohanar/togglemaster-gitops.git
    targetRevision: main
    path: observability/loki

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true