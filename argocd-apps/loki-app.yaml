apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 12.0.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: Monolithic

        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: filesystem

          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            retention_period: 24h

        monolithic:
          replicas: 1
          persistence:
            enabled: false

        gateway:
          enabled: true
          service:
            type: ClusterIP

        lokiCanary:
          enabled: false

        chunksCache:
          enabled: false

        resultsCache:
          enabled: false

        test:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true