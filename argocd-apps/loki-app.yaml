apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.3
    helm:
      releaseName: loki-stack
      values: |
        loki:
          enabled: true
          isDefault: false
          persistence:
            enabled: false
          service:
            type: ClusterIP

        promtail:
          enabled: true
          config:
            clients:
              - url: http://loki-stack:3100/loki/api/v1/push

        grafana:
          enabled: false
          sidecar:
            datasources:
              enabled: false

        prometheus:
          enabled: false

        fluent-bit:
          enabled: false

        filebeat:
          enabled: false

        logstash:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true