apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "uid": "togglemaster-overview",
      "title": "ToggleMaster - Overview",
      "tags": ["togglemaster", "fiap", "fase4"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "Pods Running - ToggleMaster",
          "id": 1,
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"togglemaster\", phase=\"Running\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Pods com Restart",
          "id": 2,
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"togglemaster\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU por Pod",
          "id": 3,
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"togglemaster\", container!=\"\"}[5m])) by (pod)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memória por Pod",
          "id": 4,
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"togglemaster\", container!=\"\"}) by (pod)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "table",
          "title": "Status dos Pods",
          "id": 5,
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "kube_pod_status_phase{namespace=\"togglemaster\"}",
              "refId": "A",
              "format": "table"
            }
          ]
        }
      ]
    }