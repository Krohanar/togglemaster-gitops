apiVersion: batch/v1
kind: Job
metadata:
  name: flag-db-init
  namespace: togglemaster
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: postgres-client
          image: postgres:16
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-service-secret
                  key: DATABASE_URL
          command:
            - /bin/sh
            - -c
            - |
              psql "$DATABASE_URL" -f /sql/init.sql
          volumeMounts:
            - name: init-sql
              mountPath: /sql
      volumes:
        - name: init-sql
          configMap:
            name: flag-db-init-sql